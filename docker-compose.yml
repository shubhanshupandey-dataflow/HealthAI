# Production on a VM:  docker compose up -d --build
# Needs .env next to this file. The backend listens on 127.0.0.1 only (default port 8000,
# change with BACKEND_PORT in .env); the VM's nginx proxies the subdomain to it over HTTPS.

services:
  backend:
    build: .
    image: adele-sophie
    env_file: .env
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - sophie-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    restart: unless-stopped

  agent:
    image: adele-sophie
    pull_policy: never  # built locally by the backend service
    command: ["python", "agent/agent.py", "start"]
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    # Give calls in progress time to finish on restart/redeploy
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  sophie-data:
